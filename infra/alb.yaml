AWSTemplateFormatVersion: "2010-09-09"
Description: Load balancer. Internal ALB, target group, listener and regional WAF; depends only on the network, so CloudFront attaches to it while the database is created.

Parameters:
  StackPrefix:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  AppSubnetIds:
    Type: CommaDelimitedList
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  ViewerRateLimit:
    Type: Number
    Default: 300
    MinValue: 10

Resources:
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internal
      Subnets: !Ref AppSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroupId]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: idle_timeout.timeout_seconds
          Value: "30"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      VpcId: !Ref VpcId
      HealthCheckPath: /livez
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub ${StackPrefix}-alb
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${StackPrefix}-alb
      Rules:
        - Name: rate-limit-per-viewer
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref ViewerRateLimit
              EvaluationWindowSec: 300
              AggregateKeyType: FORWARDED_IP
              ForwardedIPConfig:
                HeaderName: x-viewer-ip
                FallbackBehavior: NO_MATCH
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-limit-per-viewer
        - Name: aws-common
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-common
        - Name: aws-known-bad-inputs
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-known-bad-inputs

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt WebAcl.Arn

Outputs:
  AlbArn:
    Value: !Ref LoadBalancer
  AlbDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  AlbFullName:
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
  TargetGroupArn:
    Value: !Ref TargetGroup
  TargetGroupFullName:
    Value: !GetAtt TargetGroup.TargetGroupFullName
