      AlarmName: !Sub ${StackPrefix}-page-availability-slow-burn
      AlarmDescription: >-
        PAGE. API availability is spending its 30-day error budget 6 times too fast (5% of the budget in 6 hours).
        Runbook: docs/runbooks/api-availability.md
      Metrics:
