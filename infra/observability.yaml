          MetricStat:
            Metric:
              Namespace: AWS/ApplicationSignals
              MetricName: BurnRate
              Dimensions:
                - {Name: SloName, Value: !Sub "${StackPrefix}-data-freshness"}
                - {Name: BurnRateWindowMinutes, Value: "30"}
            Period: 60
            Stat: Maximum
        - Id: both
          ReturnData: true
          Expression: MIN([long, short])
      ComparisonOperator: GreaterThanThreshold
      Threshold: 6
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  FreshnessBudgetBurnAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: FreshnessSlo
    Properties:
      AlarmName: !Sub ${StackPrefix}-ticket-freshness-budget-burn
      AlarmDescription: >-
        TICKET. Data freshness has spent its 30-day error budget at or above the sustainable rate for 3 days (10% of the budget).
        Runbook: docs/runbooks/data-freshness.md
      Metrics:
        - Id: long
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationSignals
              MetricName: BurnRate
              Dimensions:
                - {Name: SloName, Value: !Sub "${StackPrefix}-data-freshness"}
                - {Name: BurnRateWindowMinutes, Value: "4320"}
            Period: 60
            Stat: Maximum
        - Id: short
          ReturnData: false
          MetricStat:
