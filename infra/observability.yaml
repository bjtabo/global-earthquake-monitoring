              Namespace: AWS/ApplicationSignals
              MetricName: BurnRate
              Dimensions:
                - {Name: SloName, Value: !Sub "${StackPrefix}-data-freshness"}
                - {Name: BurnRateWindowMinutes, Value: "360"}
            Period: 60
            Stat: Maximum
        - Id: both
          ReturnData: true
          Expression: MIN([long, short])
      ComparisonOperator: GreaterThanThreshold
      Threshold: 1
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  CanaryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: canary
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactsBucket}/canary/*
              - Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactsBucket}
              # ListAllMyBuckets has no resource-level permissions; Synthetics calls it before writing artifacts.
              - Effect: Allow
                Action: s3:ListAllMyBuckets
                Resource: "*"
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cwsyn-${StackPrefix}-canary-*
              # PutMetricData has no resource-level permissions; the condition pins the namespace.
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals: {cloudwatch:namespace: CloudWatchSynthetics}

  Canary:
    Type: AWS::Synthetics::Canary
    Properties:
      Name: !Sub ${StackPrefix}-canary
      RuntimeVersion: !Ref CanaryRuntime
      ExecutionRoleArn: !GetAtt CanaryRole.Arn
      ArtifactS3Location: !Sub s3://${ArtifactsBucket}/canary
      Schedule:
        Expression: rate(5 minutes)
      StartCanaryAfterCreation: true
      SuccessRetentionPeriod: 2
      FailureRetentionPeriod: 7
      ProvisionedResourceCleanup: AUTOMATIC
      # Declared here: the canary was missing the tag the stack propagates (drift.sh showed it).
      Tags:
        - {Key: Project, Value: !Ref StackPrefix}
      RunConfig:
        TimeoutInSeconds: 60
        EnvironmentVariables:
          HOST: !Ref DistributionDomainName
      Code:
        Handler: index.handler
        Script: |
          const synthetics = require('@aws/synthetics-puppeteer');
          // Step names allow letters, numbers, hyphens, underscores, periods and spaces only.
          const steps = { page: '/', health: '/health', significant: '/api/quakes/significant',
            'daily-average': '/api/stats/daily-average', search: '/api/quakes/search' };
          const expect200 = (path) => async (res) => new Promise((resolve, reject) => {
            if (res.statusCode !== 200) return reject(new Error(`${path} returned ${res.statusCode}`));
            res.on('data', () => {});
            res.on('end', resolve);
          });
          exports.handler = async () => {
            for (const [name, path] of Object.entries(steps)) {
              await synthetics.executeHttpStep(name,
                { hostname: process.env.HOST, method: 'GET', path, port: 443, protocol: 'https:' },
                expect200(path));
            }
          };

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: WantsBudget
    Properties:
      Budget:
        BudgetName: !Sub ${StackPrefix}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]

  CanaryFailingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${StackPrefix}-page-canary-failing
      AlarmDescription: "PAGE. The synthetic check through CloudFront is failing or not running. Runbook: docs/runbooks/canary.md"
      Namespace: CloudWatchSynthetics
      MetricName: SuccessPercent
      Dimensions:
        - {Name: CanaryName, Value: !Ref Canary}
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 100
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  IngestErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${StackPrefix}-ticket-ingest-errors
      AlarmDescription: "TICKET. The ingestion Lambda failed in each of the last 15 minutes. Runbook: docs/runbooks/data-freshness.md"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref IngestFunctionName}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  ScheduleDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${StackPrefix}-ticket-schedule-dlq
      AlarmDescription: "TICKET. EventBridge Scheduler could not deliver an ingestion run. Runbook: docs/runbooks/data-freshness.md"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - {Name: QueueName, Value: !Ref ScheduleDeadLetterQueueName}
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  UnhealthyTasksAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${StackPrefix}-ticket-unhealthy-tasks
      AlarmDescription: "TICKET. At least one API task has failed ALB health checks for 5 minutes. Runbook: docs/runbooks/api-availability.md"
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - {Name: LoadBalancer, Value: !Ref AlbFullName}
        - {Name: TargetGroup, Value: !Ref TargetGroupFullName}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
