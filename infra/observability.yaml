      AlarmDescription: "TICKET. Database CPU above 80% for 15 minutes. Runbook: docs/runbooks/database.md"
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - {Name: DBInstanceIdentifier, Value: !Ref DbInstanceId}
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  DbStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${StackPrefix}-ticket-db-storage
      AlarmDescription: "TICKET. Database free storage below 2 GiB. Runbook: docs/runbooks/database.md"
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - {Name: DBInstanceIdentifier, Value: !Ref DbInstanceId}
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  DbMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${StackPrefix}-ticket-db-memory
      AlarmDescription: "TICKET. Database freeable memory below 100 MiB for 15 minutes. Runbook: docs/runbooks/database.md"
      Namespace: AWS/RDS
      MetricName: FreeableMemory
      Dimensions:
        - {Name: DBInstanceIdentifier, Value: !Ref DbInstanceId}
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 104857600
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref StackPrefix
      DashboardBody: !Sub |
        {"widgets": [
          {"type": "metric", "x": 0, "y": 0, "width": 8, "height": 6, "properties": {"title": "SLO attainment (%)", "region": "${AWS::Region}", "stat": "Minimum", "period": 300, "view": "timeSeries", "metrics": [["AWS/ApplicationSignals", "AttainmentRate", "SloName", "${StackPrefix}-api-availability"], ["AWS/ApplicationSignals", "AttainmentRate", "SloName", "${StackPrefix}-api-latency"], ["AWS/ApplicationSignals", "AttainmentRate", "SloName", "${StackPrefix}-data-freshness"]]}},
          {"type": "metric", "x": 8, "y": 0, "width": 8, "height": 6, "properties": {"title": "Burn rate, 60-minute window", "region": "${AWS::Region}", "stat": "Maximum", "period": 60, "view": "timeSeries", "metrics": [["AWS/ApplicationSignals", "BurnRate", "SloName", "${StackPrefix}-api-availability", "BurnRateWindowMinutes", "60"], ["AWS/ApplicationSignals", "BurnRate", "SloName", "${StackPrefix}-api-latency", "BurnRateWindowMinutes", "60"], ["AWS/ApplicationSignals", "BurnRate", "SloName", "${StackPrefix}-data-freshness", "BurnRateWindowMinutes", "60"]]}},
          {"type": "metric", "x": 16, "y": 0, "width": 8, "height": 6, "properties": {"title": "Canary success (%)", "region": "${AWS::Region}", "stat": "Average", "period": 300, "view": "timeSeries", "metrics": [["CloudWatchSynthetics", "SuccessPercent", "CanaryName", "${StackPrefix}-canary"]]}},
          {"type": "metric", "x": 0, "y": 6, "width": 8, "height": 6, "properties": {"title": "Requests and 5xx", "region": "${AWS::Region}", "stat": "Sum", "period": 60, "view": "timeSeries", "metrics": [["AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${AlbFullName}"], ["AWS/ApplicationELB", "HTTPCode_Target_5XX_Count", "LoadBalancer", "${AlbFullName}"], ["AWS/ApplicationELB", "HTTPCode_ELB_5XX_Count", "LoadBalancer", "${AlbFullName}"]]}},
          {"type": "metric", "x": 8, "y": 6, "width": 8, "height": 6, "properties": {"title": "Target response time (s)", "region": "${AWS::Region}", "stat": "p95", "period": 60, "view": "timeSeries", "metrics": [["AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${AlbFullName}", {"stat": "p50"}], ["AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${AlbFullName}", {"stat": "p95"}], ["AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${AlbFullName}", {"stat": "p99"}]]}},
          {"type": "metric", "x": 16, "y": 6, "width": 8, "height": 6, "properties": {"title": "WAF blocked requests per rule", "region": "${AWS::Region}", "stat": "Sum", "period": 60, "view": "timeSeries", "metrics": [["AWS/WAFV2", "BlockedRequests", "WebACL", "${StackPrefix}-alb", "Region", "${AWS::Region}", "Rule", "rate-limit-per-viewer"], ["AWS/WAFV2", "BlockedRequests", "WebACL", "${StackPrefix}-alb", "Region", "${AWS::Region}", "Rule", "aws-common"], ["AWS/WAFV2", "BlockedRequests", "WebACL", "${StackPrefix}-alb", "Region", "${AWS::Region}", "Rule", "aws-known-bad-inputs"]]}},
          {"type": "metric", "x": 0, "y": 12, "width": 8, "height": 6, "properties": {"title": "Data lag (s)", "region": "${AWS::Region}", "stat": "Maximum", "period": 300, "view": "timeSeries", "metrics": [["${StackPrefix}/Ingest", "DataLagSeconds", "Service", "ingest"]]}},
          {"type": "metric", "x": 8, "y": 12, "width": 8, "height": 6, "properties": {"title": "Ingestion runs", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries", "metrics": [["${StackPrefix}/Ingest", "IngestSuccess", "Service", "ingest", {"stat": "Minimum"}], ["${StackPrefix}/Ingest", "EventsUpserted", "Service", "ingest"], ["${StackPrefix}/Ingest", "EventsSkipped", "Service", "ingest"]]}},
          {"type": "metric", "x": 16, "y": 12, "width": 8, "height": 6, "properties": {"title": "Ingest Lambda and DLQ", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries", "metrics": [["AWS/Lambda", "Errors", "FunctionName", "${IngestFunctionName}"], ["AWS/Lambda", "Duration", "FunctionName", "${IngestFunctionName}", {"stat": "p95"}], ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${ScheduleDeadLetterQueueName}", {"stat": "Maximum"}]]}},
          {"type": "metric", "x": 0, "y": 18, "width": 8, "height": 6, "properties": {"title": "ECS service (%)", "region": "${AWS::Region}", "stat": "Average", "period": 60, "view": "timeSeries", "metrics": [["AWS/ECS", "CPUUtilization", "ClusterName", "${ClusterName}", "ServiceName", "${ServiceName}"], ["AWS/ECS", "MemoryUtilization", "ClusterName", "${ClusterName}", "ServiceName", "${ServiceName}"]]}},
          {"type": "metric", "x": 8, "y": 18, "width": 8, "height": 6, "properties": {"title": "Healthy tasks", "region": "${AWS::Region}", "stat": "Minimum", "period": 60, "view": "timeSeries", "metrics": [["AWS/ApplicationELB", "HealthyHostCount", "LoadBalancer", "${AlbFullName}", "TargetGroup", "${TargetGroupFullName}"]]}},
          {"type": "metric", "x": 16, "y": 18, "width": 8, "height": 6, "properties": {"title": "Database", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries", "metrics": [["AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "${DbInstanceId}", {"stat": "Average"}], ["AWS/RDS", "DatabaseConnections", "DBInstanceIdentifier", "${DbInstanceId}", {"stat": "Maximum"}], ["AWS/RDS", "FreeableMemory", "DBInstanceIdentifier", "${DbInstanceId}", {"stat": "Minimum", "yAxis": "right"}], ["AWS/RDS", "FreeStorageSpace", "DBInstanceIdentifier", "${DbInstanceId}", {"stat": "Minimum", "yAxis": "right"}]]}},
          {"type": "alarm", "x": 0, "y": 24, "width": 24, "height": 6, "properties": {"title": "Alarms", "alarms": ["${CanaryFailingAlarm.Arn}", "${AvailabilityFastBurnAlarm.Arn}", "${AvailabilitySlowBurnAlarm.Arn}", "${AvailabilityBudgetBurnAlarm.Arn}", "${LatencyFastBurnAlarm.Arn}", "${LatencySlowBurnAlarm.Arn}", "${LatencyBudgetBurnAlarm.Arn}", "${FreshnessFastBurnAlarm.Arn}", "${FreshnessSlowBurnAlarm.Arn}", "${FreshnessBudgetBurnAlarm.Arn}", "${IngestErrorsAlarm.Arn}", "${ScheduleDlqAlarm.Arn}", "${UnhealthyTasksAlarm.Arn}", "${DbCpuAlarm.Arn}", "${DbStorageAlarm.Arn}", "${DbMemoryAlarm.Arn}"]}}
        ]}

Outputs:
  AlertTopicArn:
    Value: !Ref AlertTopic
  SloNames:
    Value: !Sub ${StackPrefix}-api-availability,${StackPrefix}-api-latency,${StackPrefix}-data-freshness
  CanaryName:
    Value: !Ref Canary
  DashboardName:
    Value: !Ref Dashboard
