      Metrics:
        - Id: long
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationSignals
              MetricName: BurnRate
              Dimensions:
                - {Name: SloName, Value: !Sub "${StackPrefix}-data-freshness"}
                - {Name: BurnRateWindowMinutes, Value: "60"}
            Period: 60
            Stat: Maximum
        - Id: short
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationSignals
              MetricName: BurnRate
              Dimensions:
                - {Name: SloName, Value: !Sub "${StackPrefix}-data-freshness"}
                - {Name: BurnRateWindowMinutes, Value: "10"}
            Period: 60
            Stat: Maximum
        - Id: both
          ReturnData: true
          Expression: MIN([long, short])
      ComparisonOperator: GreaterThanThreshold
      Threshold: 14.4
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  FreshnessSlowBurnAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: FreshnessSlo
    Properties:
      AlarmName: !Sub ${StackPrefix}-page-freshness-slow-burn
      AlarmDescription: >-
