AWSTemplateFormatVersion: "2010-09-09"
Description: Observability. Alert topic, SLOs, burn-rate alarms, operational alarms, canary, dashboard and budget.

Parameters:
  StackPrefix:
    Type: String
  AlertEmail:
    Type: String
    AllowedPattern: ^[^@\s]+@[^@\s]+$
  AlbFullName:
    Type: String
  TargetGroupFullName:
    Type: String
  IngestFunctionName:
    Type: String
  ScheduleDeadLetterQueueName:
    Type: String
  DbInstanceId:
    Type: String
  ClusterName:
    Type: String
  ServiceName:
    Type: String
  DistributionDomainName:
    Type: String
  ArtifactsBucket:
    Type: String
  CanaryRuntime:
    Type: String
    Default: syn-nodejs-puppeteer-18.0
  MonthlyBudgetUsd:
    Type: String
    Default: "0"
    AllowedPattern: ^[0-9]+$

Conditions:
  WantsBudget: !Not [!Equals [!Ref MonthlyBudgetUsd, "0"]]

Resources:
  # Unencrypted: alarm payloads carry no data, and CloudWatch cannot publish to a topic under the AWS managed SNS key.
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${StackPrefix}-alerts
  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail
  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudWatchAlarmsInThisAccount
            Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
              ArnLike: {aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:*"}

  AvailabilitySlo:
    Type: AWS::ApplicationSignals::ServiceLevelObjective
    Properties:
      Name: !Sub ${StackPrefix}-api-availability
      Description: Share of requests reaching the ALB that did not end in a 5xx from a task or from the load balancer
      RequestBasedSli:
        RequestBasedSliMetric:
          TotalRequestCountMetric:
            - Id: requests
              ReturnData: false
              MetricStat:
                Metric:
                  Namespace: AWS/ApplicationELB
                  MetricName: RequestCount
                  Dimensions: [{Name: LoadBalancer, Value: !Ref AlbFullName}]
                Period: 60
                Stat: Sum
            - Id: elbtotal
              ReturnData: false
              MetricStat:
                Metric:
                  Namespace: AWS/ApplicationELB
                  MetricName: HTTPCode_ELB_5XX_Count
                  Dimensions: [{Name: LoadBalancer, Value: !Ref AlbFullName}]
                Period: 60
                Stat: Sum
            - Id: total
              ReturnData: true
              Expression: FILL(requests, 0) + FILL(elbtotal, 0)
          MonitoredRequestCountMetric:
            BadCountMetric:
              - Id: target5xx
                ReturnData: false
                MetricStat:
                  Metric:
                    Namespace: AWS/ApplicationELB
                    MetricName: HTTPCode_Target_5XX_Count
                    Dimensions: [{Name: LoadBalancer, Value: !Ref AlbFullName}]
                  Period: 60
                  Stat: Sum
              - Id: elb5xx
                ReturnData: false
                MetricStat:
                  Metric:
                    Namespace: AWS/ApplicationELB
                    MetricName: HTTPCode_ELB_5XX_Count
                    Dimensions: [{Name: LoadBalancer, Value: !Ref AlbFullName}]
                  Period: 60
                  Stat: Sum
              - Id: bad
                ReturnData: true
                Expression: FILL(target5xx, 0) + FILL(elb5xx, 0)
      Goal:
        Interval:
          RollingInterval: {Duration: 30, DurationUnit: DAY}
        AttainmentGoal: 99.9
      BurnRateConfigurations:
        - LookBackWindowMinutes: 5
        - LookBackWindowMinutes: 30
        - LookBackWindowMinutes: 60
        - LookBackWindowMinutes: 360
        - LookBackWindowMinutes: 4320

  LatencySlo:
    Type: AWS::ApplicationSignals::ServiceLevelObjective
    Properties:
      Name: !Sub ${StackPrefix}-api-latency
      Description: Minutes in which the p95 time the tasks took to answer the ALB stayed at or under 300 ms
      Sli:
        SliMetric:
          MetricDataQueries:
            - Id: p95
              ReturnData: false
              MetricStat:
                Metric:
                  Namespace: AWS/ApplicationELB
                  MetricName: TargetResponseTime
                  Dimensions: [{Name: LoadBalancer, Value: !Ref AlbFullName}]
                Period: 60
                Stat: p95
            - Id: latency
              ReturnData: true
              Expression: FILL(p95, 0)
        MetricThreshold: 0.3
        ComparisonOperator: LessThanOrEqualTo
      Goal:
        Interval:
          RollingInterval: {Duration: 30, DurationUnit: DAY}
        AttainmentGoal: 99
      BurnRateConfigurations:
        - LookBackWindowMinutes: 5
        - LookBackWindowMinutes: 30
        - LookBackWindowMinutes: 60
        - LookBackWindowMinutes: 360
        - LookBackWindowMinutes: 4320

  FreshnessSlo:
    Type: AWS::ApplicationSignals::ServiceLevelObjective
    Properties:
      Name: !Sub ${StackPrefix}-data-freshness
      Description: 10-minute periods in which the newest USGS data we served was at most 10 minutes old
      Sli:
        SliMetric:
          MetricDataQueries:
            - Id: lag
              ReturnData: false
              MetricStat:
                Metric:
                  Namespace: !Sub ${StackPrefix}/Ingest
                  MetricName: DataLagSeconds
                  Dimensions: [{Name: Service, Value: ingest}]
                Period: 600
                Stat: Maximum
            - Id: freshness
              ReturnData: true
              Expression: FILL(lag, 86400)
        MetricThreshold: 600
        ComparisonOperator: LessThanOrEqualTo
      Goal:
        Interval:
          RollingInterval: {Duration: 30, DurationUnit: DAY}
        AttainmentGoal: 99
      BurnRateConfigurations:
        - LookBackWindowMinutes: 10
        - LookBackWindowMinutes: 30
        - LookBackWindowMinutes: 60
        - LookBackWindowMinutes: 360
        - LookBackWindowMinutes: 4320

  AvailabilityFastBurnAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AvailabilitySlo
    Properties:
      AlarmName: !Sub ${StackPrefix}-page-availability-fast-burn
      AlarmDescription: >-
        PAGE. API availability is spending its 30-day error budget 14.4 times too fast (2% of the budget in an hour).
        Runbook: docs/runbooks/api-availability.md
      Metrics:
        - Id: long
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationSignals
              MetricName: BurnRate
              Dimensions:
                - {Name: SloName, Value: !Sub "${StackPrefix}-api-availability"}
                - {Name: BurnRateWindowMinutes, Value: "60"}
            Period: 60
            Stat: Maximum
        - Id: short
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationSignals
              MetricName: BurnRate
              Dimensions:
                - {Name: SloName, Value: !Sub "${StackPrefix}-api-availability"}
                - {Name: BurnRateWindowMinutes, Value: "5"}
            Period: 60
            Stat: Maximum
        - Id: both
          ReturnData: true
          Expression: MIN([long, short])
      ComparisonOperator: GreaterThanThreshold
      Threshold: 14.4
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  AvailabilitySlowBurnAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AvailabilitySlo
